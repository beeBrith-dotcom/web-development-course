<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <label for="name">Name:</label>
      <input type="text" placeholder="Enter your name" name="userName" id="name" required />

      <br />
      <br />

      <label for="fname">Father Name:</label>
      <input type="text" placeholder="Enter your father name" name="userFaherName" id="fname" required />

      <br />
      <br />

      <label for="age">Age:</label>
      <input type="number" placeholder="Enter your age" name="userAge" id="age" required />

      <br />
      <br />

      <label for="pass">Password:</label>
      <input type="password" placeholder="Enter your password" name="userPassword" id="pass" required />

      <br />
      <br />

      <label for="male">Male</label>
      <input type="radio" name="gender" id="male" value="male" required />

      <label for="female">Female</label>
      <input type="radio" name="gender" id="female" value="female" required />

      <label for="other">Other</label>
      <input type="radio" name="gender" id="other" value="other" required />

      <br />
      <br />

      <label for="html">HTML</label>
      <input type="checkbox" id="html" value="html" />
      <label for="css">CSS</label>
      <input type="checkbox" id="css" value="css" />

      <label for="javaScript">JavaScript</label>
      <input type="checkbox" id="javaScript" value="javaScript" />

      <label for="python">Python</label>
      <input type="checkbox" id="python" value="python" />

      <br />
      <br />

      <input type="submit" />
    </form>
  </body>
</html>
