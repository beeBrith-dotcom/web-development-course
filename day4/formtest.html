<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>University Registration Form</h1>
    <p>Please fill out the form below to register.</p>

    <hr />

    <!-- todo: Personal Details -->

    <form action="">
      <h2>Personal Details</h2>

      <label for="firstname">First Name</label>
      <input type="text" name="firstname" id="firstname" placeholder="e.g., Zain" required />
      <br />
      <br />
      <label for="lastname">Last Name</label>
      <input type="text" name="lastname" id="lastname" placeholder="e.g., xyz" required />

      <br />
      <br />

      <label for="DOB">Date:</label>
      <input type="date" name="DOB" id="DOB" />

      <br />
      <br />

      <label for="gender">Gender:</label>

      <br />

      <input type="radio" name="gender" id="male" value="male" required />
      <label for="male">Male:</label>

      <br />

      <input type="radio" name="gender" id="female" value="female" required />
      <label for="female">Female:</label>

      <br />

      <input type="radio" name="gender" id="other" value="other" required />
      <label for="other">Other:</label>

      <br />
      <br />
      <label for="photo">Upload Your Photo:</label>
      <br />
      <input type="file" name="photo" id="photo" required />

      <br />
      <br />
      <hr />

      <!-- todo: Contact information -->
      <h2>Contact Information</h2>
      <label for="email">Email Address:</label>
      <input type="email" name="email" id="email" placeholder="you@example.com" />
      <br />
      <br />
      <label for="phone">Phone Number:</label>
      <input type="tel" name="phone" id="phone" placeholder="e.g., 9876543210" />

      <br />
      <br />
      <label for="address">Mailing Address:</label>
      <br />

      <textarea name="address" id="address" rows="5" cols="20"></textarea>
      <br />

      <!-- todo: Academic information -->
      <h2>Academic Information</h2>
      <label for="course">Select Your Course:</label>
      <br />
      <select name="course" id="course">
        <option value="mern">MERN Stack</option>
        <option value="lamp">LAMP Stack</option>
        <option value="ai">Ai Powered</option>
      </select>

      <br />
      <h3>Interest</h3>
      <br />
      <input type="checkbox" name="Interest" id="sports" />
      <label for="sports">Sports</label>
      <br />
      <input type="checkbox" name="Interest" id="music" />
      <label for="music">Music and Arts</label>
      <br />
      <input type="checkbox" name="Interest" id="technology" />
      <label for="technology">Technology Clubs</label>
      <br />
      <input type="checkbox" name="Interest" id="volunteering" />
      <label for="volunteering">Volunteering</label>
      <br />
      <br />
      <hr />
      <!-- todo: Create Account -->
      <h2>Create Your Account</h2>
      <label for="password">Create your password:</label>
      <input type="password" name="password" id="password" />
      <br />
      <br />

      <label for="security">Security Questions:</label>
      <select name="security" id="security">
        <option value="">What is your first name?</option>
      </select>
      <br />
      <br />
      <label for="answer">Security Answer:</label>
      <input type="" name="answer" id="answer" />
      <br />
      <br />
      <input type="checkbox" name="terms" id="terms" />
      <label for="terms">I agree to the Terms and Conditions.</label>
      <br />
      <br />
      <hr />
      <button type="submit">Register</button>
      <button type="reset">Clear form</button>
      <br />
    </form>
  </body>
</html>
